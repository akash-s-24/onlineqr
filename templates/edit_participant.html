{% extends 'base.html' %}

{% block title %}Edit Participant – EventMate{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Edit Participant Details</h1>
        <p>Update participant profile and contact records</p>
    </div>
    <div class="page-actions">
        <a href="{{ url_for('participants_list') }}" class="btn btn-secondary">&larr; Back to Directory</a>
    </div>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('edit_participant', participant_id=participant.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="full_name">Participant Full Name *</label>
                <input type="text" id="full_name" name="full_name" class="form-control" value="{{ participant.full_name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email Address *</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ participant.email }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="phone">Phone Number *</label>
                <input type="text" id="phone" name="phone" class="form-control" value="{{ participant.phone }}" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="semester">Semester</label>
                <input type="text" id="semester" name="semester" class="form-control" value="{{ participant.semester }}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="college_name">College Name *</label>
            <input type="text" id="college_name" name="college_name" class="form-control" value="{{ participant.college_name }}" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="department">Department *</label>
            <input type="text" id="department" name="department" class="form-control" value="{{ participant.department }}" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Save Changes</button>
    </form>
</div>
{% endblock %}
