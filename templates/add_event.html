{% extends 'base.html' %}

{% block title %}Create Event – EventMate{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title">
        <h1>Create New Event</h1>
        <p>Add a new technical competition or workshop to the college symposium</p>
    </div>
    <div class="page-actions">
        <a href="{{ url_for('events_list') }}" class="btn btn-secondary">&larr; Back to Events</a>
    </div>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('add_event') }}">
        <div class="form-group">
            <label class="form-label" for="event_name">Event Name *</label>
            <input type="text" id="event_name" name="event_name" class="form-control" placeholder="e.g. CodeCraft / ByteBattle" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="event_type">Event Type / Category *</label>
                <input type="text" id="event_type" name="event_type" class="form-control" placeholder="e.g. Hackathon, Coding, Web Dev" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="max_participants">Max Participants Capacity</label>
                <input type="number" id="max_participants" name="max_participants" class="form-control" value="60" min="1">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="event_date">Event Date *</label>
                <input type="text" id="event_date" name="event_date" class="form-control" placeholder="e.g. 18-sep-2026" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="event_time">Event Time *</label>
                <input type="text" id="event_time" name="event_time" class="form-control" placeholder="e.g. 09:30 AM" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="venue">Venue / Room *</label>
                <input type="text" id="venue" name="venue" class="form-control" placeholder="e.g. CS Lab 1 / Auditorium" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="event_fee">Event Fee (₹)</label>
                <input type="number" id="event_fee" name="event_fee" class="form-control" value="0" min="0">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Event Description & Rules</label>
            <textarea id="description" name="description" class="form-control" rows="4" placeholder="Describe the objectives, team size, rounds, and eligibility criteria..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Publish Event</button>
    </form>
</div>
{% endblock %}
