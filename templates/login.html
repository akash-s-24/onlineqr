{% extends 'base.html' %}

{% block title %}Admin Login – EventMate Portal{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">EM</div>
        <div class="login-heading">
            <h2>Administrator Sign In</h2>
            <p>Secure access to EventMate management</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="login">
            
            <div class="login-field">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus autocomplete="username"
                    class="login-input">
            </div>

            <div class="login-field login-password-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password"
                    class="login-input">
            </div>

            <button type="submit" class="login-submit">
                Sign in &rarr;
            </button>
        </form>

        <div class="login-footer">
            <span>Participant registration?</span>
            <a href="{{ url_for('register_participant') }}">Join Event &rarr;</a>
        </div>
    </div>
</div>

<style>
    .login-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }
    .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.1);
    }
    .login-brand {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #2563eb;
        font-size: 1.8rem;
        font-weight: 800;
    }
    .login-heading {
        text-align: center;
        margin-bottom: 2rem;
    }
    .login-heading h2 {
        color: #0f172a;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
    }
    .login-heading p, .login-footer span {
        color: #64748b;
        font-size: 0.95rem;
    }
    .login-field { margin-bottom: 1.25rem; }
    .login-password-field { margin-bottom: 1.75rem; }
    .login-field label {
        display: block;
        color: #334155;
        font-size: 0.85rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }
    .login-input {
        width: 100%;
        padding: 12px 16px;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        color: #0f172a;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s;
    }
    .login-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .login-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .login-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px rgba(37, 99, 235, 0.3);
    }
    .login-footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        text-align: center;
        border-top: 1px solid #e2e8f0;
    }
    .login-footer a {
        color: #2563eb;
        font-weight: 700;
        font-size: 0.9rem;
        margin-left: 0.25rem;
    }
    @media (max-width: 480px) {
        .login-card { padding: 28px 22px; }
    }
</style>
{% endblock %}
