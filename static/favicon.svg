<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Academic Mortarboard / Graduation Cap -->
  <polygon points="32 16 50 24 32 32 14 24" fill="url(#goldGrad)"/>
  <polygon points="21 28 21 38 32 44 43 38 43 28 32 33" fill="#ffffff" opacity="0.95"/>
  <!-- Tassel -->
  <path d="M48 24.5 L50 33 L47 34" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Star Accent -->
  <circle cx="32" cy="51" r="3" fill="#fbbf24"/>
</svg>
