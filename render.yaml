services:
  - type: web
    name: shree-daksha-academy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: APP_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: SMTP_MODE
        value: demo
      - key: PAYMENT_MODE
        value: live
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MEMBER_PASSWORD
        sync: false
      - key: DEFAULT_UPI_ID
        value: 919980846695@federal
      - key: UPI_PAYEE_NAME
        value: CHETHANA K
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: BASE_URL
        sync: false
      - key: COLLEGE_NAME
        value: Shree Daksha Academy
      - key: COLLEGE_SUBTITLE
        value: Recognized by the Government of Karnataka, affiliated to Bengaluru University, approved by AICTE.
      - key: EVENT_TITLE
        value: Daksha Infinix
